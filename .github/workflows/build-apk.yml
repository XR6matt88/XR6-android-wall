name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Android APK (Flet)
        id: build
        uses: flet-dev/flet-build-action@74d5761
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}
          archive-output: "false"

      - name: Prepare APK file
        shell: bash
        run: |
          mkdir -p release-apk
          APK_FILE=$(find "${{ steps.build.outputs.output-path }}" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Tiada fail .apk ditemui!"
            exit 1
          fi
          cp "$APK_FILE" "release-apk/xr6-toolkit-v0.1.${{ github.run_number }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xr6-toolkit-apk
          path: release-apk/*.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: XR6 Toolkit v0.1.${{ github.run_number }} (Android APK)
          make_latest: true
          files: release-apk/*.apk
